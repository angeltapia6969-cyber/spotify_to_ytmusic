- name: Build with Briefcase
  shell: pwsh
  run: |
    $ErrorActionPreference = "Stop"

    python -m briefcase create windows -v
    if ($LASTEXITCODE -ne 0) {
      Write-Host "Briefcase create failed"
      Get-ChildItem -Path . -Recurse -Filter "briefcase*.log" -ErrorAction SilentlyContinue |
        ForEach-Object {
          Write-Host "`n===== $($_.FullName) ====="
          Get-Content $_.FullName
        }
      exit $LASTEXITCODE
    }

    python -m briefcase build windows -v
    if ($LASTEXITCODE -ne 0) {
      Write-Host "Briefcase build failed"
      exit $LASTEXITCODE
    }

    python -m briefcase package windows -v
    if ($LASTEXITCODE -ne 0) {
      Write-Host "Briefcase package failed"
      exit $LASTEXITCODE
    }
